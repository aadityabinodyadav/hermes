# deploy/kubernetes/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: hermes
  labels:
    app: hermes
spec:
  serviceName: "hermes"  # headless service name
  replicas: 5            # 5-node cluster
  
  # Pod selection
  selector:
    matchLabels:
      app: hermes
  
  # ORDER MATTERS:
  # - podManagementPolicy: OrderedReady
  #   hermes-0 starts FIRST (becomes seed node)
  #   hermes-1 starts AFTER hermes-0 is ready
  #   etc.
  podManagementPolicy: OrderedReady
  
  template:
    metadata:
      labels:
        app: hermes
      annotations:
        # Tell Prometheus to scrape this pod
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    
    spec:
      # DON'T run as root
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      # Prefer spreading pods across nodes
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: hermes
      
      containers:
      - name: hermes
        image: hermes:latest
        imagePullPolicy: IfNotPresent
        
        command: ["hermes-server"]
        args:
        - server
        - "--node-id=$(POD_NAME)"
        - "--listen-addr=0.0.0.0:7000"
        - "--data-dir=/data"
        - "--initial-cluster=$(INITIAL_CLUSTER)"
        
        env:
        # Stable pod name from Kubernetes
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        
        # Build cluster peers from StatefulSet naming convention:
        # hermes-0.hermes.hermes.svc.cluster.local
        # hermes-1.hermes.hermes.svc.cluster.local
        # etc.
        - name: INITIAL_CLUSTER
          value: "hermes-0=hermes-0.hermes.hermes.svc.cluster.local:7000,hermes-1=hermes-1.hermes.hermes.svc.cluster.local:7000,hermes-2=hermes-2.hermes.hermes.svc.cluster.local:7000,hermes-3=hermes-3.hermes.hermes.svc.cluster.local:7000,hermes-4=hermes-4.hermes.hermes.svc.cluster.local:7000"
        
        # Tune GC for latency-sensitive workloads
        - name: GOGC
          value: "200"       # GC less aggressively
        - name: GOMEMLIMIT
          value: "6GiB"      # Soft memory limit
        
        ports:
        - name: grpc
          containerPort: 7000
        - name: metrics
          containerPort: 9090
        - name: health
          containerPort: 8080
        
        # Resource limits
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        
        # Storage
        volumeMounts:
        - name: data
          mountPath: /data
        
        # Health probes
        livenessProbe:
          httpGet:
            path: /healthz/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        startupProbe:
          httpGet:
            path: /healthz/startup
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30  # 5 minutes to start
  
  # Persistent volumes — ONE per pod, NEVER shared
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]  # only ONE pod mounts at a time
      storageClassName: "fast-ssd"    # NVMe preferred
      resources:
        requests:
          storage: 100Gi